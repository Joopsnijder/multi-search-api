  - name: yandex
    engine: yandex
    shortcut: yd
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    base_url: "https://nl.wikipedia.org/"
